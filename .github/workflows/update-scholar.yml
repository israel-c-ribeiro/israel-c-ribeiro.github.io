name: Refresh citation data

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "scholarly>=1.7" "bibtexparser<2"

      - name: Refresh data/scholar.json
        run: python scripts/update_scholar.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/scholar.json; then
            echo "No change in citation data."
          else
            git add data/scholar.json
            git commit -m "data: refresh citation metrics ($(date -u +%Y-%m-%d))"
            git push
          fi
